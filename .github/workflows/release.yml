# Multi-platform release builds for EZMusicProduction.
# Triggers on version tags (v*) and manual dispatch.
# Produces artefacts for macOS, Linux and Windows x64.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # macOS
  # ------------------------------------------------------------------
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CMake, Ninja and libsndfile
        run: |
          brew install cmake ninja libsndfile

      - name: Download Flutter SDK
        run: |
          git clone --depth 1 --branch 3.29.3 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Generate app version
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from tag: $VERSION"
          else
            VERSION="$(date -u +%y.%m.%d).${GITHUB_RUN_NUMBER}"
            echo "No vYY.MM.DD.N tag — using UTC date + run number: $VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ui/lib/generated
          cat > ui/lib/generated/version.dart <<EOF
          // GENERADO por el workflow de release — no editar a mano.
          const String kAppVersion = '$VERSION';
          EOF

      - name: Build engine
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --target cadence_engine_shared -j $(sysctl -n hw.ncpu)

      - name: Build Flutter app
        run: |
          cd ui
          flutter pub get
          flutter build macos --release

      - name: Package macOS app
        run: |
          APP="ui/build/macos/Build/Products/Release/EZMusicProduction.app"
          # Stamp the generated release version into the bundle (About, Finder,
          # crash reports) — same as build_app.sh does for local builds.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" \
            "$APP/Contents/Info.plist"
          # Copy engine dylib into the app bundle
          cp "build/engine/libcadence_engine.dylib" "$APP/Contents/MacOS/"
          # Re-sign the dylib and the bundle
          codesign --force --sign - "$APP/Contents/MacOS/libcadence_engine.dylib"
          codesign --force --sign - "$APP"
          codesign -v "$APP"
          # Compress
          cd "ui/build/macos/Build/Products/Release"
          tar -czf "$GITHUB_WORKSPACE/EZMusicProduction-macos.tar.gz" EZMusicProduction.app

      - name: Upload macOS artefact
        uses: actions/upload-artifact@v4
        with:
          name: EZMusicProduction-macos
          path: EZMusicProduction-macos.tar.gz

      - name: Release macOS
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: EZMusicProduction-macos.tar.gz

  # ------------------------------------------------------------------
  # Linux
  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build patchelf \
            libgtk-3-dev libblkid-dev libsndfile1-dev \
            libopenblas-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            libxi-dev libxcursor-dev libxcomposite-dev libxdamage-dev \
            libxss-dev libxtst-dev

      - name: Download Flutter SDK
        run: |
          git clone --depth 1 --branch 3.29.3 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Generate app version
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from tag: $VERSION"
          else
            VERSION="$(date -u +%y.%m.%d).${GITHUB_RUN_NUMBER}"
            echo "No vYY.MM.DD.N tag — using UTC date + run number: $VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ui/lib/generated
          cat > ui/lib/generated/version.dart <<EOF
          // GENERADO por el workflow de release — no editar a mano.
          const String kAppVersion = '$VERSION';
          EOF

      - name: Build engine
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target cadence_engine_shared -j $(nproc)

      - name: Build Flutter app
        run: |
          cd ui
          flutter pub get
          flutter build linux --release

      - name: Package Linux app
        run: |
          BUNDLE="ui/build/linux/x64/release/bundle"
          # Copy the engine .so next to the executable (FFI lookup path).
          # Keep only $ORIGIN as its RUNPATH: the build-tree RUNPATH would
          # point at paths that don't exist on the user's machine.
          cp "build/engine/libcadence_engine.so" "$BUNDLE/"
          patchelf --set-rpath '$ORIGIN' "$BUNDLE/libcadence_engine.so"
          # Copy runtime dependencies of the engine .so (libopenblas,
          # libfluidsynth, ...). The .so carries an $ORIGIN RPATH (engine
          # CMakeLists) so the loader resolves them from the bundle dir.
          # Base system libraries are skipped: they exist on every desktop
          # Linux and shadowing glibc/libstdc++ from another distro would
          # crash the process (GLIBC_PRIVATE / libstdc++ version mismatch).
          ldd "build/engine/libcadence_engine.so" | \
            awk '/ => / && !/ => not found/ { print $3 }' | \
            while read -r dep; do
              if [ -n "$dep" ] && [ -f "$dep" ]; then
                base=$(basename "$dep")
                case "$base" in
                  ld-linux*|libc.so*|libm.so*|libdl*|libpthread*|librt.so*|libresolv*|libnss*|libnsl*|libanl*|libutil*|libstdc++*|libgcc_s*|libX11*|libXext*|libXrandr*|libXfixes*|libXcursor*|libXi*|libXcomposite*|libXdamage*|libXss*|libXtst*|libxcb*|libXau*|libXdmcp*)
                    echo "Skipped system library: $base"
                    ;;
                  *)
                    # Each copied lib needs its own $ORIGIN RUNPATH: DT_RUNPATH
                    # is not transitive, so without this second-level deps
                    # (e.g. libopenblas -> libgfortran) would miss the bundle.
                    cp -L "$dep" "$BUNDLE/"
                    patchelf --set-rpath '$ORIGIN' "$BUNDLE/$base"
                    echo "Copied dependency: $base"
                    ;;
                esac
              fi
            done
          # Compress the bundle
          cd "ui/build/linux/x64/release"
          tar -czf "$GITHUB_WORKSPACE/EZMusicProduction-linux.tar.gz" bundle

      - name: Upload Linux artefact
        uses: actions/upload-artifact@v4
        with:
          name: EZMusicProduction-linux
          path: EZMusicProduction-linux.tar.gz

      - name: Release Linux
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: EZMusicProduction-linux.tar.gz

  # ------------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.29.3 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Generate app version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Version from tag: $VERSION"
          else
            VERSION="$(date -u +%y.%m.%d).${GITHUB_RUN_NUMBER}"
            echo "No vYY.MM.DD.N tag — using UTC date + run number: $VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ui/lib/generated
          cat > ui/lib/generated/version.dart <<EOF
          // GENERADO por el workflow de release — no editar a mano.
          const String kAppVersion = '$VERSION';
          EOF

      - name: Build engine
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCADENCE_SF3=OFF
          cmake --build build --config Release --target cadence_engine_shared -j "$(nproc)"

      - name: Build Flutter app
        shell: bash
        run: |
          cd ui
          flutter pub get
          # Patch desktop_multi_window: Flutter 3.29+ removed set_ui_thread_policy.
          # On Windows, pub cache is at %LOCALAPPDATA%\Pub\Cache (not $HOME/.pub-cache).
          PUB_CACHE_DIR="${LOCALAPPDATA}/Pub/Cache"
          FLUTTER_WINDOW_CC=$(find "$PUB_CACHE_DIR" -path "*/desktop_multi_window*/windows/flutter_window.cc" 2>/dev/null | head -1)
          if [ -n "$FLUTTER_WINDOW_CC" ]; then
            echo "Found flutter_window.cc at: $FLUTTER_WINDOW_CC"
            sed -i 's/project\.set_ui_thread_policy(/\/\/ project.set_ui_thread_policy(/' "$FLUTTER_WINDOW_CC"
            echo "Patched successfully"
          else
            echo "WARNING: flutter_window.cc not found, patching skipped"
          fi
          flutter build windows --release

      - name: Package Windows app
        shell: bash
        run: |
          BUNDLE="ui/build/windows/x64/runner/Release"
          # Visual Studio puts the DLL in the Release/ subdirectory
          cp "build/engine/Release/cadence_engine.dll" "$BUNDLE/"
          # FluidSynth (built from source via FetchContent) is a DLL the engine
          # links against — copy it (fluidsynth[-2].dll under
          # _deps/fluidsynth-build/src/<Config>/) and any other runtime DLLs
          # from its build tree. LoadLibrary's search already includes the exe
          # directory, so no extra path config is required.
          find build/_deps/fluidsynth-build -name "*.dll" -print -exec cp {} "$BUNDLE/" \; 2>/dev/null || true
          # Compress the bundle
          cd "ui/build/windows/x64/runner"
          7z a "$GITHUB_WORKSPACE/EZMusicProduction-windows.zip" Release/

      - name: Upload Windows artefact
        uses: actions/upload-artifact@v4
        with:
          name: EZMusicProduction-windows
          path: EZMusicProduction-windows.zip

      - name: Release Windows
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: EZMusicProduction-windows.zip
